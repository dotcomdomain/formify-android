name: Build Paradee TTS APK
on:
  push:
    branches: [ci/paradee-tts-apk-20261110]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack independent Paradee source
        run: |
          mkdir -p paradee-ci
          base64 -d .paradee-ci-bundle.b64 | tar -xz -C paradee-ci
      - name: Generate pronunciation dictionary
        working-directory: paradee-ci
        run: |
          python -m pip install cmudict
          python - <<'PY'
          import cmudict
          from pathlib import Path
          Path('cmudict.dict').write_text('\n'.join(' '.join([word] + phones) for word,phones in cmudict.entries()), encoding='utf-8')
          PY
          python tools/make_lexicon.py cmudict.dict
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile signed debug APK
        working-directory: paradee-ci
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paradee-build
          path: |
            paradee-ci/app/build/outputs/apk/debug/*.apk
            paradee-ci/app/build/reports/problems/*
          if-no-files-found: warn
