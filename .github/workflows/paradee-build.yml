name: Build Paradee TTS APK
on:
  push:
    branches: [ci/paradee-tts-apk-20261110]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack independent Paradee source
        run: |
          mkdir -p paradee-ci
          base64 -d .paradee-ci-bundle.b64 | tar -xz -C paradee-ci
      - name: Generate pronunciation dictionary
        working-directory: paradee-ci
        run: |
          python -m pip install cmudict
          python - <<'PY'
          import cmudict
          from pathlib import Path
          Path('cmudict.dict').write_text('\n'.join(' '.join([word] + phones) for word,phones in cmudict.entries()), encoding='utf-8')
          PY
          python tools/make_lexicon.py cmudict.dict
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Fix voice service visibility
        working-directory: paradee-ci
        run: |
          sed -i -e 's/@Override protected List<Voice> onGetVoices()/@Override public List<Voice> onGetVoices()/' -e 's/@Override protected String onGetDefaultVoiceNameFor(/@Override public String onGetDefaultVoiceNameFor(/' -e 's/@Override protected int onIsValidVoiceName(/@Override public int onIsValidVoiceName(/' -e 's/@Override protected int onLoadVoice(/@Override public int onLoadVoice(/' app/src/main/java/app/paradee/tts/ParadeeTtsService.java
      - name: Preserve compressed pronunciation asset
        working-directory: paradee-ci
        run: |
          mv app/src/main/assets/lexicon.tsv.gz app/src/main/assets/lexicon.dat
          sed -i 's/lexicon.tsv.gz/lexicon.dat/' app/src/main/java/app/paradee/tts/ParadeeSynthesizer.java
          sed -i 's/versionCode 1/versionCode 2/; s/versionName '\''0.1.0'\''/versionName '\''0.1.1'\''/' app/build.gradle
          python - <<'PY'
          import gzip
          from pathlib import Path
          p = Path('app/src/main/assets/lexicon.dat')
          with gzip.open(p, 'rt', encoding='utf-8') as f:
              data = f.read()
          assert len(data.splitlines()) > 120000, "Invalid pronunciation dictionary"
          print("Pronunciation dictionary ready:", len(data.splitlines()), "entries")
          PY
      - name: Compile signed debug APK
        working-directory: paradee-ci
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK contains readable compressed lexicon
        working-directory: paradee-ci
        run: |
          python - <<'PY'
          import gzip, io, zipfile
          p = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(p) as z:
              assets = [x for x in z.namelist() if x.startswith("assets/")]
              assert 'assets/lexicon.dat' in assets, assets
              assert 'assets/lexicon.tsv' not in assets, assets
              with gzip.open(io.BytesIO(z.read('assets/lexicon.dat')), 'rt', encoding='utf-8') as f:
                  entries = sum(1 for _ in f)
              assert entries >= 120000, entries
              print(f"APK verified: {entries} dictionary entries, valid gzip payload.")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paradee-build
          path: |
            paradee-ci/app/build/outputs/apk/debug/*.apk
            paradee-ci/app/build/reports/problems/*
          if-no-files-found: warn
