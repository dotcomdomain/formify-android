<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formify">
<meta name="theme-color" content="#f5efe4">
<meta name="description" content="Find a business, fill in its form before you arrive, and skip the line. Or just tell the Formify assistant what you need.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Formify</title>
<script>try{var q=new URLSearchParams(location.search).get("theme");if(q==="blue"||q==="warm")localStorage.setItem("fz_theme",q);if((q||localStorage.getItem("fz_theme")||"blue")==="blue")document.documentElement.dataset.theme="blue"}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/formify.css">
</head>
<body class="app">
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#search"><span class="mark">Form<i>ify</i></span><span class="tag">Your forms and visits</span></a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="search">Search</button>
      <button data-tab="visits">Visits<span class="tabdot" id="unreadDot" hidden></span></button>
      <button data-tab="assistant">Assistant</button>
      <button data-tab="you">You</button>
    </nav>
    <div class="right"><button class="theme-dot" id="themeBtn" title="Switch theme" aria-label="Switch colour theme"></button><a class="biz-link" href="/business.html">For businesses</a></div>
  </header>
  <main class="page" id="view"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="/js/consumer.js"></script>
</body>
</html>
