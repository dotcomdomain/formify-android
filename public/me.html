<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>My info</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="nav">
  <a class="logo" href="/find.html" style="text-decoration:none;color:inherit">Form<span>ify</span></a>
  <nav><a href="/find.html">Find</a><a href="/me.html" class="on">My info</a><a href="/">For businesses</a></nav>
</div>
<div class="wrap" style="max-width:640px;padding-top:8px">
  <h1 style="font-size:28px">My info</h1>
  <p class="muted">Saved only on this phone. Businesses get it only when you check in with them, and only the fields their form asks for.</p>

  <div class="card">
    <form id="f" onsubmit="return false">
      <label for="name">Name</label><input id="name" autocomplete="name">
      <label for="dob">Date of birth</label><input id="dob" type="date">
      <label for="health_card">Health card number</label><input id="health_card" autocomplete="off">
      <label for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel">
      <label for="email">Email</label><input id="email" type="email" autocomplete="email">
    </form>
    <div class="row" style="margin-top:18px;justify-content:space-between">
      <button id="save">Save</button>
      <button id="wipe" class="ghost">Delete everything</button>
    </div>
    <p id="msg" class="muted small" style="margin-top:10px"></p>
  </div>

  <h2 style="font-size:20px;margin-top:28px">Recent check-ins</h2>
  <div id="visits" class="card"></div>
</div>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KEYS = ["name", "dob", "health_card", "phone", "email"];
const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function show() {
  const p = read("ks_profile", {});
  for (const k of KEYS) $(`#${k}`).value = p[k] || "";
  const visits = read("ks_visits", []);
  $("#visits").innerHTML = visits.length ? visits.map((v) => `
    <div class="row" style="justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)">
      <div><strong>${esc(v.name)}</strong><div class="muted small">Ticket ${esc(v.ticket)} · ${new Date(v.at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</div></div>
      <a href="/visit.html#${esc(v.token)}" class="small">Status</a>
    </div>`).join("") : '<p class="muted small" style="margin:0">No check-ins yet. <a href="/find.html">Find a business</a></p>';
}

$("#save").onclick = () => {
  const p = {};
  for (const k of KEYS) { const v = $(`#${k}`).value.trim(); if (v) p[k] = v; }
  write("ks_profile", p);
  $("#msg").textContent = "Saved on this phone.";
};
$("#wipe").onclick = () => {
  try { localStorage.removeItem("ks_profile"); localStorage.removeItem("ks_visits"); } catch {}
  show();
  $("#msg").textContent = "Deleted from this phone.";
};
show();
</script>
</body>
</html>
