    <rect x="9" y="24" width="18" height="5" rx="2.5" fill="#f5efe4" opacity=".55"/>
    <path d="M10 44 L19 53 L52 20" fill="none" stroke="#4a90ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 19.5 L54.5 18 L53 30.5" fill="none" stroke="#4a90ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <text x="80" y="55" font-family="'Avenir Next','Futura','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#1b3a7a">Form<tspan font-style="italic" font-weight="500" fill="#2f6fe0">ify</tspan></text>
