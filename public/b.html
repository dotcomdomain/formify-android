<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Business</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="nav">
  <a class="logo" href="/find.html" style="text-decoration:none;color:inherit">Kiosk<span>Setup</span></a>
  <nav><a href="/find.html">Find</a><a href="/me.html">My info</a><a href="/">For businesses</a></nav>
</div>
<div class="wrap" style="max-width:720px;padding-top:8px" id="page"><p class="muted">Loading...</p></div>
<script type="module">
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const id = new URLSearchParams(location.search).get("id");
const page = document.getElementById("page");
const r = await fetch(`/api/kiosks/${encodeURIComponent(id)}`);
if (!r.ok) page.innerHTML = '<p>Business not found. <a href="/find.html">Search again</a></p>';
else {
  const { business: b } = await r.json();
  document.title = b.name;
  document.documentElement.style.setProperty("--brand", b.brand_color);
  const wait = b.waiting ? `${b.waiting} waiting now · about ${b.waiting * b.wait_minutes_per_visitor} min` : "No wait right now";
  const links = [
    b.google_reviews && `<a href="${esc(b.google_reviews)}" target="_blank" rel="noopener">Google reviews</a>`,
    b.instagram && `<a href="${esc(b.instagram)}" target="_blank" rel="noopener">Instagram</a>`,
    b.website && `<a href="${esc(b.website)}" target="_blank" rel="noopener">Website</a>`
  ].filter(Boolean).join("");
  page.innerHTML = `
    <div class="card" style="border-top:6px solid ${esc(b.brand_color)}">
      <h1 style="font-size:28px">${esc(b.name)}</h1>
      <div class="muted" style="text-transform:capitalize">${esc(b.business_type)}${b.city ? ` · ${esc(b.city)}` : ""}</div>
      <p style="margin-top:14px">${esc(b.welcome_subtitle)}</p>
      <div class="row" style="gap:28px;margin:18px 0">
        <div><div class="ease"><span class="n" style="font-size:34px;color:${esc(b.brand_color)}">${b.ease.avg ? b.ease.avg.toFixed(1) : "-"}</span><span class="l">/ 5</span></div>
          <div class="muted small">Ease Score${b.ease.count ? ` from ${b.ease.count} visitor${b.ease.count > 1 ? "s" : ""}` : " · no ratings yet"}</div></div>
        <div><div style="font-size:20px;font-weight:800">${b.waiting || 0}</div><div class="muted small">${esc(wait)}</div></div>
      </div>
      <a href="/go.html?id=${encodeURIComponent(b.id)}"><button style="width:100%;font-size:18px;padding:15px;background:${esc(b.brand_color)}">Check in from your phone</button></a>
      ${links ? `<div class="linkbtns">${links}</div>` : ""}
    </div>
    <p class="muted small" style="margin-top:14px">Ease Score is how easy visitors said checking in here was, rated after their visit. Comments go privately to the business.</p>`;
}
</script>
</body>
</html>
