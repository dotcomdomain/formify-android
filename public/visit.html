<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Your check-in</title>
<script>try{var q=new URLSearchParams(location.search).get("theme");if(q==="blue"||q==="warm")localStorage.setItem("fz_theme",q);if((q||localStorage.getItem("fz_theme"))==="blue")document.documentElement.dataset.theme="blue"}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/formify.css">
<style>
  .visit { max-width: 480px; margin: 0 auto; padding: 0 0 40px; min-height: 100vh; background: #fff; }
  .visit .k-head { background: var(--brand); color: #fff; padding: 18px; font-weight: 700; }
  .visit .in { padding: 24px 18px; }
  .big { font-size: 72px; font-weight: 800; color: var(--brand); line-height: 1; margin: 6px 0 18px; }
  .code { font-size: 44px; font-weight: 800; letter-spacing: .3em; margin: 6px 0 4px; }
  .state { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; }
  .visit button { width: 100%; font-size: 19px; padding: 16px; background: var(--brand); }
  .thread { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 12px; }
  .tm { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: 15.5px; line-height: 1.4; }
  .tm.system { align-self: center; max-width: 100%; background: transparent; color: var(--muted); font-size: 13.5px; text-align: center; padding: 2px 6px; }
  .tm.receipt { align-self: stretch; max-width: 100%; background: var(--cream, #f5efe4); border: 1px dashed var(--line); text-align: center; font-weight: 650; color: var(--ink); }
  .tm.business { align-self: flex-start; background: #eef1f5; border-bottom-left-radius: 4px; }
  .tm.customer { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .tm .who { display: block; font-size: 12px; opacity: .7; margin-bottom: 2px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .visit .quick button { width: auto; font-size: 13.5px; padding: 7px 12px; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; }
  .visit .send { display: flex; gap: 8px; }
  .visit .send input { flex: 1; }
  .visit .send button { width: auto; padding: 0 18px; font-size: 16px; }
  .visit details.box summary { cursor: pointer; font-weight: 700; color: var(--ink); font-size: 16px; }
  .visit dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 12px 0; font-size: 14.5px; }
  .visit dt { color: var(--muted); } .visit dd { margin: 0; font-weight: 600; word-break: break-word; }
  .visit .ghostbtn { background: #fff; color: var(--ink); border: 1px solid var(--line); font-size: 15px; padding: 12px; }
</style>
</head>
<body style="background:#fff">
<div class="visit">
  <div class="k-head" id="name">Your check-in</div>
  <div class="in" id="v"><p class="muted">Loading...</p></div>
  <div class="in" id="rate" style="padding-top:0"></div>
  <div class="in" style="padding-top:0">
    <div class="box" style="margin-top:0"><div class="state" style="font-size:17px">Messages</div>
      <div class="thread" id="thread" aria-live="polite"></div>
      <div class="quick" id="quick"></div>
      <form class="send" id="sendf"><input id="msg" placeholder="Message the business" autocomplete="off" aria-label="Message the business"><button>Send</button></form>
    </div>
    <details class="box" id="mydata"><summary>Your data for this visit</summary><div id="mydataBody"><p class="muted small">Loading...</p></div></details>
  </div>
  <div class="in" style="padding-top:0"><a href="/#you" class="small">My info and past check-ins</a> · <a href="/#search" class="small">Find another business</a></div>
</div>
<script type="module">
const token = location.hash.slice(1);
const v = document.getElementById("v");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let timer;

async function load() {
  const r = await fetch(`/api/visit/${encodeURIComponent(token)}`);
  if (!r.ok) { v.innerHTML = "<p>We couldn't find this check-in.</p>"; return clearInterval(timer); }
  const d = await r.json();
  document.documentElement.style.setProperty("--brand", d.brand_color);
  document.getElementById("name").textContent = d.name;
  const states = {
    pending: ["You're checked in", "Show the code at the kiosk when you arrive, or tap the button once you're inside."],
    waiting: [d.playbook === "faster_mornings" ? (d.ahead ? `Express line · ${d.ahead} ahead` : "Express line · you're next") : d.ahead ? `${d.ahead} ahead of you` : "You're next", d.wait_minutes ? `About ${d.wait_minutes} minutes. We'll call your number.` : "We'll call your number shortly."],
    serving: d.flow === "dropoff" ? ["In progress", "We're working on it. We'll message you when it's ready."] : ["It's your turn", "Please go to the front desk now."],
    ready: ["Ready for pickup", "Come pick it up whenever you're ready."],
    payment: [`Your total is $${((d.amount_cents || 0) / 100).toFixed(2)}`, "Pay here on your phone, or at the counter."],
    done: d.flow === "forms_only" && !d.paid_at ? ["Received", "Your form is in. Nothing else to do."] : [d.paid_at ? `Paid $${((d.amount_cents || 0) / 100).toFixed(2)}` : "All done", d.paid_at ? ({ card: "Paid by card. Thanks for coming in!", phone: "Paid from your phone. Thanks for coming in!" }[d.pay_method] || "Paid at the counter. Thanks for coming in!") : "Thanks for checking in."],
    "no-show": ["Check-in closed", "Please see the front desk."],
    cancelled: ["Visit cancelled", "Thanks for letting them know. You can check in again any time."]
  };
  const [title, sub] = states[d.status] || states.done;
  v.innerHTML = `<p class="muted">Your number</p><div class="big">${esc(d.ticket)}</div>
    <div class="state">${esc(title)}</div><p class="muted">${esc(sub)}</p>
    ${d.deposit_cents && !d.deposit_paid && ["pending", "waiting"].includes(d.status) ? `<div class="box"><div class="state" style="font-size:17px">Hold your spot</div><p class="muted small" style="margin:0 0 10px">A $${(d.deposit_cents / 100).toFixed(2)} deposit holds your booking. It's kept if you don't show up.</p><button id="deposit">Pay $${(d.deposit_cents / 100).toFixed(2)} deposit</button></div>` : ""}
    ${d.deposit_cents && d.deposit_paid ? `<p class="small" style="margin:0 0 12px"><span class="pill ok">Deposit paid $${(d.deposit_cents / 100).toFixed(2)}</span></p>` : ""}
    ${d.status === "payment" ? `<button id="pay">Pay $${((d.amount_cents || 0) / 100).toFixed(2)}</button><p class="muted small" style="margin-top:8px">${d.payments === "test" ? "Stripe test mode: use card 4242 4242 4242 4242, any future date, any CVC. No real money moves." : "Demo payment: no card is charged."}</p>` : ""}
    ${d.status === "pending" ? `<div class="box"><div class="muted small">Arrival code</div><div class="code">${esc(d.code)}</div><div class="muted small">Type this at the kiosk, or:</div></div>
      <button id="here">I'm here</button>` : ""}
    ${["pending", "waiting"].includes(d.status) ? '<button id="cancel" class="ghostbtn" style="margin-top:14px">Can\'t make it? Cancel my visit</button>' : ""}
    <p class="muted small" style="margin-top:28px">Keep this page open. It updates on its own. Tip: Share, then "Add to Home Screen" to check in faster next time.</p>`;
  document.getElementById("here")?.addEventListener("click", async (e) => {
    e.target.disabled = true;
    await fetch(`/api/visit/${encodeURIComponent(token)}`, { method: "POST" });
    load();
  });
  document.getElementById("deposit")?.addEventListener("click", (e) => payNow(e, "deposit"));
  document.getElementById("cancel")?.addEventListener("click", async (e) => {
    if (e.target.dataset.armed !== "1") { e.target.dataset.armed = "1"; e.target.textContent = "Tap again to cancel"; return; }
    await fetch(`/api/visit/${encodeURIComponent(token)}/cancel`, { method: "POST" });
    lastCount = -1; load(); loadThread();
  });
  rebookId = d.kiosk_id;
  document.getElementById("pay")?.addEventListener("click", async (e) => {
    payNow(e, "total");
  });
  showRating(d);
}

// Rating box is drawn once per state so polling doesn't wipe what the visitor is typing.
let rateState = "";
function showRating(d) {
  const box = document.getElementById("rate");
  const canRate = d.status === "serving" || d.status === "done";
  const state = d.rated ? "thanks" : canRate ? "ask" : "";
  if (state === rateState) return;
  rateState = state;
  // Review links are shown to everyone, whatever they rated (no review gating).
  const links = [
    d.links.google_reviews && `<a href="${esc(d.links.google_reviews)}" target="_blank" rel="noopener">Leave a Google review</a>`,
    d.links.instagram && `<a href="${esc(d.links.instagram)}" target="_blank" rel="noopener">Instagram</a>`,
    d.links.website && `<a href="${esc(d.links.website)}" target="_blank" rel="noopener">Website</a>`
  ].filter(Boolean).join("");
  const linkHtml = links ? `<div class="linkbtns">${links}</div>` : "";
  if (state === "thanks") {
    box.innerHTML = `<div class="box"><div class="state">Thanks for rating</div><p class="muted" style="margin:0">Your score helps ${esc(d.name)} make visits easier.</p>${linkHtml}</div>`;
  } else if (state === "ask") {
    box.innerHTML = `<div class="box"><div class="state">How easy was checking in?</div>
      <div class="rate">${[1, 2, 3, 4, 5].map((n) => `<button data-n="${n}">${n}</button>`).join("")}</div>
      <div class="rate-l"><span>Very hard</span><span>Very easy</span></div>
      <textarea id="comment" rows="2" placeholder="Anything we should know? (goes privately to the business)" style="margin-top:12px"></textarea>
      <button id="sendRate" style="margin-top:10px" disabled>Send</button>${linkHtml}</div>`;
    let score = 0;
    box.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => {
      score = +b.dataset.n;
      box.querySelectorAll("[data-n]").forEach((x) => x.classList.toggle("on", +x.dataset.n === score));
      box.querySelector("#sendRate").disabled = false;
    });
    box.querySelector("#sendRate").onclick = async (e) => {
      e.target.disabled = true;
      await fetch(`/api/visit/${encodeURIComponent(token)}/rate`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ score, comment: box.querySelector("#comment").value }) });
      load();
    };
  } else box.innerHTML = "";
}
// Stripe Checkout when the business has it set up; otherwise the demo payment.
async function payNow(e, kind) {
  e.target.disabled = true;
  e.target.textContent = "Paying...";
  const body = JSON.stringify({ kind });
  const r = await fetch(`/api/visit/${encodeURIComponent(token)}/checkout`, { method: "POST", headers: { "content-type": "application/json" }, body });
  const c = await r.json().catch(() => ({}));
  if (c.url) { location.href = c.url; return; }
  if (!r.ok) { e.target.textContent = c.error || "Payment failed. Pay at the counter."; return; }
  await fetch(`/api/visit/${encodeURIComponent(token)}/pay`, { method: "POST", headers: { "content-type": "application/json" }, body });
  lastCount = -1; load(); loadThread();
}
let rebookId = null;

// ---------- Visit thread ----------
let lastCount = -1;
const QUICK = ["Running about 10 minutes late", "Can I reschedule?", "I have a question about my visit"];
async function loadThread() {
  const r = await fetch(`/api/visit/${encodeURIComponent(token)}/messages`);
  if (!r.ok) return;
  const { messages } = await r.json();
  if (messages.length === lastCount) return;
  lastCount = messages.length;
  const box = document.getElementById("thread");
  box.innerHTML = messages.map((m) => {
    const t = new Date(m.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    if (m.kind === "rebook") return `<div class="tm receipt" style="font-weight:500">${esc(m.body)}<button type="button" data-rebook style="margin-top:8px;font-size:15px;padding:10px">Rebook</button></div>`;
    if (m.kind === "offer") return `<div class="tm receipt" style="background:#fff4d6;border-color:#f2c14e">${esc(m.body)} · ${t}</div>`;
    if (m.sender === "system") return `<div class="tm ${m.kind === "receipt" ? "receipt" : "system"}">${m.kind === "receipt" ? "Receipt · " : ""}${esc(m.body)} · ${t}</div>`;
    return `<div class="tm ${m.sender}">${m.sender === "business" ? `<span class="who">${esc(m.author || "Staff")} · ${t}</span>` : ""}${esc(m.body)}</div>`;
  }).join("");
  box.lastElementChild?.scrollIntoView({ block: "nearest" });
}
document.getElementById("thread").addEventListener("click", (e) => {
  if (!e.target.closest("[data-rebook]") || !rebookId) return;
  fetch(`/api/kiosks/${encodeURIComponent(rebookId)}/events`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "rebook" }) }).catch(() => {});
  location.href = `/#checkin/${encodeURIComponent(rebookId)}`;
});
document.getElementById("quick").innerHTML = QUICK.map((q) => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("");
document.getElementById("quick").addEventListener("click", (e) => { const q = e.target.dataset.q; if (q) sendMsg(q); });
document.getElementById("sendf").addEventListener("submit", (e) => { e.preventDefault(); const i = document.getElementById("msg"); if (i.value.trim()) { sendMsg(i.value); i.value = ""; } });
async function sendMsg(body) {
  const r = await fetch(`/api/visit/${encodeURIComponent(token)}/messages`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ body }) });
  if (!r.ok) { const d = await r.json().catch(() => ({})); alertBox(d.error || "Couldn't send."); }
  lastCount = -1; loadThread();
}
function alertBox(msg) { const t = document.createElement("p"); t.className = "k-err small"; t.textContent = msg; document.getElementById("sendf").after(t); setTimeout(() => t.remove(), 4000); }

// ---------- Your data for this visit ----------
async function loadData() {
  const r = await fetch(`/api/visit/${encodeURIComponent(token)}/data`);
  const body = document.getElementById("mydataBody");
  if (!r.ok) { body.innerHTML = '<p class="muted small">Not available.</p>'; return; }
  const d = await r.json();
  const fmt = (t) => new Date(t).toLocaleDateString([], { dateStyle: "medium" });
  const req = d.request;
  body.innerHTML = `<p class="muted small" style="margin:10px 0 0">${esc(d.business)} has this from your ${esc(d.form || "check-in")} on ${fmt(d.collected_at)}. It's deleted automatically on <strong>${fmt(d.delete_by)}</strong>.</p>
    ${d.fields.length ? `<dl>${d.fields.map((f) => `<dt>${esc(f.label)}</dt><dd>${f.value === true ? "Yes" : f.value === false ? "No" : esc(f.value)}</dd>`).join("")}</dl>` : '<p class="small" style="margin:12px 0"><strong>Nothing stored.</strong> Your info for this visit has been deleted.</p>'}
    <p class="muted small" style="margin:0 0 12px">Why they asked: ${esc(d.purpose)}</p>
    <div style="display:grid;gap:8px">
      <button type="button" class="ghostbtn" id="dl">Download my data</button>
      ${!req && d.fields.length ? '<button type="button" class="ghostbtn" id="del">Ask them to delete it</button>' : ""}
    </div>
    ${req ? `<p class="small" style="margin:12px 0 0"><strong>Deletion request:</strong> ${req.status === "requested" ? "sent, waiting for the business (they have 30 days)" : req.status === "deleted" ? "done, your info was deleted" : `the business needs to keep it: ${esc(req.note || "")}`}</p>` : ""}`;
  document.getElementById("dl").onclick = () => {
    const blob = new Blob([JSON.stringify({ business: d.business, form: d.form, ticket: d.ticket, collected_at: new Date(d.collected_at).toISOString(), delete_by: new Date(d.delete_by).toISOString(), purpose: d.purpose, data: Object.fromEntries(d.fields.map((f) => [f.label, f.value])) }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `formify-${d.ticket}.json`; a.click();
  };
  document.getElementById("del")?.addEventListener("click", async (e) => {
    // Two taps so it can't be sent by accident.
    if (e.target.dataset.armed !== "1") { e.target.dataset.armed = "1"; e.target.textContent = "Tap again to send the request"; return; }
    await fetch(`/api/visit/${encodeURIComponent(token)}/data`, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
    loadData(); lastCount = -1; loadThread();
  });
}
document.getElementById("mydata").addEventListener("toggle", (e) => { if (e.target.open) loadData(); });

// Back from Stripe: confirm with the server (which asks Stripe) before showing "Paid".
const sessionId = new URLSearchParams(location.search).get("session_id");
if (sessionId) {
  v.innerHTML = '<p class="muted">Confirming your payment...</p>';
  await fetch(`/api/visit/${encodeURIComponent(token)}/confirm`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session_id: sessionId }) }).catch(() => {});
  history.replaceState(null, "", `/visit.html#${token}`);
}
load();
loadThread();
timer = setInterval(() => { load(); loadThread(); }, 5000);
</script>
</body>
</html>
