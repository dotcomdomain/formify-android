<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Your check-in</title>
<script>try{var q=new URLSearchParams(location.search).get("theme");if(q==="blue"||q==="warm")localStorage.setItem("fz_theme",q);if((q||localStorage.getItem("fz_theme"))==="blue")document.documentElement.dataset.theme="blue"}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/formify.css">
<style>
  .visit { max-width: 480px; margin: 0 auto; padding: 0 0 40px; min-height: 100vh; background: #fff; }
  .visit .k-head { background: var(--brand); color: #fff; padding: 18px; font-weight: 700; }
  .visit .in { padding: 24px 18px; }
  .big { font-size: 72px; font-weight: 800; color: var(--brand); line-height: 1; margin: 6px 0 18px; }
  .code { font-size: 44px; font-weight: 800; letter-spacing: .3em; margin: 6px 0 4px; }
  .state { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; }
  .visit button { width: 100%; font-size: 19px; padding: 16px; background: var(--brand); }
</style>
</head>
<body style="background:#fff">
<div class="visit">
  <div class="k-head" id="name">Your check-in</div>
  <div class="in" id="v"><p class="muted">Loading...</p></div>
  <div class="in" id="rate" style="padding-top:0"></div>
  <div class="in" style="padding-top:0"><a href="/#you" class="small">My info and past check-ins</a> · <a href="/#search" class="small">Find another business</a></div>
</div>
<script type="module">
const token = location.hash.slice(1);
const v = document.getElementById("v");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let timer;

async function load() {
  const r = await fetch(`/api/visit/${encodeURIComponent(token)}`);
  if (!r.ok) { v.innerHTML = "<p>We couldn't find this check-in.</p>"; return clearInterval(timer); }
  const d = await r.json();
  document.documentElement.style.setProperty("--brand", d.brand_color);
  document.getElementById("name").textContent = d.name;
  const states = {
    pending: ["You're checked in", "Show the code at the kiosk when you arrive, or tap the button once you're inside."],
    waiting: [d.ahead ? `${d.ahead} ahead of you` : "You're next", d.wait_minutes ? `About ${d.wait_minutes} minutes. We'll call your number.` : "We'll call your number shortly."],
    serving: ["It's your turn", "Please go to the front desk now."],
    payment: [`Your total is $${((d.amount_cents || 0) / 100).toFixed(2)}`, "Pay here on your phone, or at the counter."],
    done: [d.paid_at ? `Paid $${((d.amount_cents || 0) / 100).toFixed(2)}` : "All done", d.paid_at ? ({ card: "Paid by card. Thanks for coming in!", phone: "Paid from your phone. Thanks for coming in!" }[d.pay_method] || "Paid at the counter. Thanks for coming in!") : "Thanks for checking in."],
    "no-show": ["Check-in closed", "Please see the front desk."]
  };
  const [title, sub] = states[d.status] || states.done;
  v.innerHTML = `<p class="muted">Your number</p><div class="big">${esc(d.ticket)}</div>
    <div class="state">${esc(title)}</div><p class="muted">${esc(sub)}</p>
    ${d.status === "payment" ? `<button id="pay">Pay $${((d.amount_cents || 0) / 100).toFixed(2)}</button><p class="muted small" style="margin-top:8px">${d.payments === "test" ? "Stripe test mode: use card 4242 4242 4242 4242, any future date, any CVC. No real money moves." : "Demo payment: no card is charged."}</p>` : ""}
    ${d.status === "pending" ? `<div class="box"><div class="muted small">Arrival code</div><div class="code">${esc(d.code)}</div><div class="muted small">Type this at the kiosk, or:</div></div>
      <button id="here">I'm here</button>` : ""}
    <p class="muted small" style="margin-top:28px">Keep this page open. It updates on its own. Tip: Share, then "Add to Home Screen" to check in faster next time.</p>`;
  document.getElementById("here")?.addEventListener("click", async (e) => {
    e.target.disabled = true;
    await fetch(`/api/visit/${encodeURIComponent(token)}`, { method: "POST" });
    load();
  });
  document.getElementById("pay")?.addEventListener("click", async (e) => {
    e.target.disabled = true;
    e.target.textContent = "Paying...";
    // Stripe Checkout when the business has it set up; otherwise the demo payment.
    const r = await fetch(`/api/visit/${encodeURIComponent(token)}/checkout`, { method: "POST" });
    const c = await r.json().catch(() => ({}));
    if (c.url) { location.href = c.url; return; }
    if (!r.ok) { e.target.textContent = c.error || "Payment failed. Pay at the counter."; return; }
    await fetch(`/api/visit/${encodeURIComponent(token)}/pay`, { method: "POST" });
    load();
  });
  showRating(d);
}

// Rating box is drawn once per state so polling doesn't wipe what the visitor is typing.
let rateState = "";
function showRating(d) {
  const box = document.getElementById("rate");
  const canRate = d.status === "serving" || d.status === "done";
  const state = d.rated ? "thanks" : canRate ? "ask" : "";
  if (state === rateState) return;
  rateState = state;
  // Review links are shown to everyone, whatever they rated (no review gating).
  const links = [
    d.links.google_reviews && `<a href="${esc(d.links.google_reviews)}" target="_blank" rel="noopener">Leave a Google review</a>`,
    d.links.instagram && `<a href="${esc(d.links.instagram)}" target="_blank" rel="noopener">Instagram</a>`,
    d.links.website && `<a href="${esc(d.links.website)}" target="_blank" rel="noopener">Website</a>`
  ].filter(Boolean).join("");
  const linkHtml = links ? `<div class="linkbtns">${links}</div>` : "";
  if (state === "thanks") {
    box.innerHTML = `<div class="box"><div class="state">Thanks for rating</div><p class="muted" style="margin:0">Your score helps ${esc(d.name)} make visits easier.</p>${linkHtml}</div>`;
  } else if (state === "ask") {
    box.innerHTML = `<div class="box"><div class="state">How easy was checking in?</div>
      <div class="rate">${[1, 2, 3, 4, 5].map((n) => `<button data-n="${n}">${n}</button>`).join("")}</div>
      <div class="rate-l"><span>Very hard</span><span>Very easy</span></div>
      <textarea id="comment" rows="2" placeholder="Anything we should know? (goes privately to the business)" style="margin-top:12px"></textarea>
      <button id="sendRate" style="margin-top:10px" disabled>Send</button>${linkHtml}</div>`;
    let score = 0;
    box.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => {
      score = +b.dataset.n;
      box.querySelectorAll("[data-n]").forEach((x) => x.classList.toggle("on", +x.dataset.n === score));
      box.querySelector("#sendRate").disabled = false;
    });
    box.querySelector("#sendRate").onclick = async (e) => {
      e.target.disabled = true;
      await fetch(`/api/visit/${encodeURIComponent(token)}/rate`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ score, comment: box.querySelector("#comment").value }) });
      load();
    };
  } else box.innerHTML = "";
}
// Back from Stripe: confirm with the server (which asks Stripe) before showing "Paid".
const sessionId = new URLSearchParams(location.search).get("session_id");
if (sessionId) {
  v.innerHTML = '<p class="muted">Confirming your payment...</p>';
  await fetch(`/api/visit/${encodeURIComponent(token)}/confirm`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session_id: sessionId }) }).catch(() => {});
  history.replaceState(null, "", `/visit.html#${token}`);
}
load();
timer = setInterval(load, 5000);
</script>
</body>
</html>
