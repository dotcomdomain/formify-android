<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<title>Check in</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="fullkiosk">
<div id="k"><p class="muted" style="padding:30px">Loading...</p></div>
<script type="module">
import { mountKiosk } from "/render.js";

const id = new URLSearchParams(location.search).get("id");
const root = document.getElementById("k");
const api = (path, body) => fetch(`/api/kiosks/${encodeURIComponent(id)}/${path}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
  .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error); return d; });

const r = await fetch(`/api/kiosks/${encodeURIComponent(id)}`);
if (!r.ok) {
  root.innerHTML = '<p style="padding:30px">This kiosk link is not valid.</p>';
} else {
  const { config } = await r.json();
  document.title = config.name;
  mountKiosk(root, config, {
    mode: "kiosk",
    kioskId: id,
    qrUrl: `${location.origin}/go.html?id=${encodeURIComponent(id)}`,
    onSubmit: (body) => api("checkins", body),
    onArrive: (code) => api("arrive", { code })
  });
}
</script>
</body>
</html>
