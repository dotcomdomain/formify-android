<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=99d5443956">
<link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=99d5443956">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formify">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest?v=916199d2b9">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=916199d2b9">
<title>Check in</title>
<script>try{var q=new URLSearchParams(location.search).get("theme");if(q==="blue"||q==="warm")localStorage.setItem("fz_theme",q);if((q||localStorage.getItem("fz_theme")||"blue")==="blue")document.documentElement.dataset.theme="blue"}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/formify.css">
</head>
<body class="fullkiosk">
<div id="k"><p class="muted" style="padding:30px">Loading...</p></div>
<script type="module">
import { mountKiosk } from "/render.js";

const id = new URLSearchParams(location.search).get("id");
const root = document.getElementById("k");
const r = id ? await fetch(`/api/kiosks/${encodeURIComponent(id)}`) : null;
if (!r?.ok) {
  root.innerHTML = '<p style="padding:30px">Scan the QR code at the front desk to check in.</p>';
} else {
  const { config } = await r.json();
  fetch(`/api/kiosks/${encodeURIComponent(id)}/events`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: "start" }) }).catch(() => {});
  document.title = `Check in · ${config.name}`;
  mountKiosk(root, config, {
    mode: "phone",
    kioskId: id,
    onSubmit: async (body) => {
      const res = await fetch(`/api/kiosks/${encodeURIComponent(id)}/checkins`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      return data;
    },
    // The token goes in the URL fragment so it never reaches server logs or referrers.
    onDone: (result) => {
      // Remember the visit on this phone so "My info" can link back to it.
      try {
        const visits = JSON.parse(localStorage.getItem("ks_visits") || "[]");
        visits.unshift({ token: result.token, ticket: result.ticket, name: config.name, kiosk_id: id, at: Date.now() });
        localStorage.setItem("ks_visits", JSON.stringify(visits.slice(0, 20)));
      } catch {}
      location.href = `/visit.html#${result.token}`;
    }
  });
}
</script>
</body>
</html>
