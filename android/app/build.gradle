plugins { id 'com.android.application' }

// Signing credentials remain outside the repository. Without this variable,
// assembleRelease produces an unsigned artifact rather than using a debug key.
def releaseSigningPath = providers.environmentVariable('FORMIFY_SIGNING_PROPERTIES').orNull
def releaseSigning = new Properties()
if (releaseSigningPath) {
    file(releaseSigningPath).withInputStream { releaseSigning.load(it) }
}

android {
    namespace 'app.formify.android'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'app.formify.android'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.0.6'
        testInstrumentationRunner 'app.formify.android.SmokeInstrumentation'
    }
    signingConfigs {
        if (releaseSigningPath) {
            release {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningPath) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep the app's interaction fixes in the same source as the website client.
def customerClientAssets = layout.buildDirectory.dir('generated/customerClientAssets')
tasks.register('bundleCustomerClient', Copy) {
    from rootProject.file('../public/js/consumer.js')
    from rootProject.file('../public/render.js')
    from rootProject.file('../public/assistant.css')
    into customerClientAssets
}
android.sourceSets.main.assets.srcDir(customerClientAssets)
tasks.named('preBuild').configure { dependsOn 'bundleCustomerClient' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}
